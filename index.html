<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Crypto Wallet</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <main class="screen">

    <!-- Balance -->
    <section class="balance">
      <h1 class="balance-amount"><span class="cur">$</span>2,258<span class="cents">.93</span></h1>
      <div class="change-pill">
        <span class="up">+7.87%</span>
        <span class="dot">·</span>
        <span>Today</span>
      </div>
    </section>

    <!-- Quick actions -->
    <section class="actions">
      <button class="action">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 20V5M7.5 5L3.8 8.8M7.5 5l3.7 3.8M16.5 4v15M16.5 19l-3.7-3.8M16.5 19l3.7-3.8"/></svg>
        <span>Transfer</span>
      </button>
      <button class="action">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11V9.5A3.5 3.5 0 0 1 8 6h11.5M16.5 2.8l3.2 3.2-3.2 3.2M19.5 13v1.5a3.5 3.5 0 0 1-3.5 3.5H4.5M7.5 14.8L4.3 18l3.2 3.2"/></svg>
        <span>Swap</span>
      </button>
      <button class="action">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15"/></svg>
        <span>Buy</span>
      </button>
    </section>

    <!-- Segmented control -->
    <div class="seg" id="seg">
      <button class="seg-btn active" data-tab="assets">Assets</button>
      <button class="seg-btn" data-tab="accounts">Accounts</button>
    </div>

    <!-- Assets -->
    <section id="assets" class="list">
      <div class="row">
        <div class="coin btc">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.6h4.2a2.5 2.5 0 0 1 0 5H9m0 0h4.9a2.75 2.75 0 0 1 0 5.5H9V6.6zM11 4.4v2.2M14 4.4v2.2M11 17.1v2.3M14 17.1v2.3"/></svg>
        </div>
        <div class="meta">
          <div class="name">Bitcoin</div>
          <div class="sub">0.000023 BTC</div>
        </div>
        <div class="val">
          <div class="name">$0.00</div>
          <div class="sub up">+7.87%</div>
        </div>
      </div>

      <div class="row">
        <div class="coin eth">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l-5.3 8.6L12 15.3l5.3-3.1z"/><path d="M12 17l-5.3-3.1L12 20.4l5.3-6.5z"/></svg>
        </div>
        <div class="meta">
          <div class="name">Ethereum</div>
          <div class="sub">0.45 ETH</div>
        </div>
        <div class="val">
          <div class="name">$1,858.08</div>
          <div class="sub up">+12.32%</div>
        </div>
      </div>
    </section>

    <!-- Accounts -->
    <section id="accounts" class="list hidden">
      <div class="empty">No linked accounts yet.</div>
    </section>

  </main>

  <!-- Liquid glass nav -->
  <nav class="nav" aria-label="Main">
    <div class="nav-glass">
      <button class="nav-btn active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M12 3c.6 0 1.1.2 1.5.6l6 5.2c.3.4.5.9.5 1.4V18a3 3 0 0 1-3 3H14.5v-5.5a1.5 1.5 0 0 0-1.5-1.5h-2a1.5 1.5 0 0 0-1.5 1.5V21H7a3 3 0 0 1-3-3v-7.8c0-.5.2-1 .5-1.4l6-5.2C10.9 3.2 11.4 3 12 3z"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11V9.5A3.5 3.5 0 0 1 8 6h11.5M16.5 2.8l3.2 3.2-3.2 3.2M19.5 13v1.5a3.5 3.5 0 0 1-3.5 3.5H4.5M7.5 14.8L4.3 18l3.2 3.2"/></svg>
        <span>Swap</span>
      </button>
      <button class="nav-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5.6"/><path d="M7 15.2l3.5-4 2.6 2.6 4-5M14.2 8.8h2.9v2.9"/></svg>
        <span>Earn</span>
      </button>
      <button class="nav-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.9" y="5" width="18.2" height="14" rx="4.4"/><path d="M3 10.2h18M7 15h3"/></svg>
        <span>Card</span>
      </button>
    </div>
  </nav>

</div>
<script src="script.js"></script>
</body>
</html>
